<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects Editor — isaacsauer.github.io</title>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1e1e1e;
  --bg-mid: #252526;
  --bg-panel: #2d2d2d;
  --border: #3e3e42;
  --border-light: #4a4a4f;
  --text: #d4d4d4;
  --text-muted: #858585;
  --text-dim: #6a6a6a;
  --blue: #4fc1ff;
  --blue-btn: #0e639c;
  --blue-btn-h: #1177bb;
  --green: #4ec994;
  --orange: #ce9178;
  --red: #f44747;
  --red-btn: #6e1414;
  --red-btn-h: #8b1c1c;
  --accent: #007acc;
  --selected: #094771;
  --hover: #2a2d2e;
  --input-bg: #3c3c3c;
  --input-border: #555;
  --input-focus: #007acc;
  --tag-bg: #37373d;
  --tag-border: #555;
  --sidebar-w: 240px;
  --toolbar-h: 44px;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Toolbar ── */
#toolbar {
  height: var(--toolbar-h);
  background: var(--bg-mid);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  flex-shrink: 0;
  z-index: 10;
}
.tb-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-right: 8px;
  flex-shrink: 0;
}
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.tb-spacer { flex: 1; }
#saveStatus {
  font-size: 11px;
  color: var(--text-muted);
  margin-right: 8px;
  transition: opacity 0.3s;
}
#saveStatus.saved { color: var(--green); }

/* ── Buttons ── */
.btn {
  padding: 5px 12px;
  border-radius: 3px;
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: background 0.1s;
  white-space: nowrap;
}
.btn-primary { background: var(--blue-btn); color: #fff; border-color: var(--blue-btn); }
.btn-primary:hover { background: var(--blue-btn-h); }
.btn-secondary { background: transparent; color: var(--text); border-color: var(--border-light); }
.btn-secondary:hover { background: var(--hover); }
.btn-danger { background: transparent; color: var(--red); border-color: var(--red-btn); }
.btn-danger:hover { background: var(--red-btn); color: #fff; }
.btn-ghost {
  padding: 3px 8px;
  border: 1px solid var(--border-light);
  border-radius: 3px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
}
.btn-ghost:hover { background: var(--hover); color: var(--text); }
.btn-icon {
  width: 26px; height: 26px;
  border: 1px solid var(--border-light);
  border-radius: 3px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: background 0.1s;
}
.btn-icon:hover { background: var(--hover); color: var(--text); }
.btn-icon.danger { color: var(--red); }
.btn-icon.danger:hover { background: var(--red-btn); color: #fff; }
.btn-add {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  border: 1px dashed var(--border-light);
  border-radius: 3px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  margin-top: 6px;
}
.btn-add:hover { border-color: var(--accent); color: var(--blue); }

/* ── Layout ── */
#layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg-mid);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
#sidebarHeader {
  padding: 8px 12px 6px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#sidebarHeader span {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-transform: uppercase;
}
#sidebarHeader button {
  width: 20px; height: 20px;
  border: none;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px;
  padding: 0;
}
#sidebarHeader button:hover { background: var(--hover); color: var(--text); }
#projectList { flex: 1; overflow-y: auto; padding: 4px 0; }

.proj-item {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  cursor: pointer;
  gap: 8px;
  border-left: 2px solid transparent;
  user-select: none;
}
.proj-item:hover { background: var(--hover); }
.proj-item.selected { background: var(--selected); border-left-color: var(--accent); }
.proj-item-name {
  flex: 1;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.proj-item-id {
  font-size: 10px;
  color: var(--text-dim);
  font-family: 'Courier New', monospace;
}
.proj-item-actions {
  display: none;
  gap: 2px;
  flex-shrink: 0;
}
.proj-item:hover .proj-item-actions,
.proj-item.selected .proj-item-actions { display: flex; }
.proj-item-btn {
  width: 18px; height: 18px;
  border: none; background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 2px;
}
.proj-item-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.proj-item-btn.del:hover { color: var(--red); }

/* ── Editor panel ── */
#editorPanel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
#noSelection {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 13px;
}
#noSelection .hint { font-size: 11px; color: var(--text-dim); }
#editForm { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#formHeader {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  background: var(--bg-mid);
}
#formTitle {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.form-header-actions { display: flex; gap: 4px; }

.form-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 0 40px;
}

/* ── Form sections ── */
.form-section {
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
}
.section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ── Form rows & inputs ── */
.form-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 7px;
}
.form-row:last-child { margin-bottom: 0; }
.form-row label {
  width: 110px;
  flex-shrink: 0;
  font-size: 12px;
  color: var(--text-muted);
  text-align: right;
}
.form-row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 7px;
}
.form-row-2:last-child { margin-bottom: 0; }
.form-col label {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 3px;
}

input[type="text"],
textarea,
select {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 3px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  padding: 4px 8px;
  outline: none;
  transition: border-color 0.15s;
}
input[type="text"]:focus,
textarea:focus,
select:focus { border-color: var(--input-focus); }
textarea { resize: vertical; line-height: 1.5; }
textarea.mono { font-family: 'Courier New', monospace; font-size: 11px; }
select option { background: var(--bg-panel); }

/* ── Tags ── */
.tags-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--tag-bg);
  border: 1px solid var(--tag-border);
  border-radius: 3px;
  padding: 2px 6px 2px 8px;
  font-size: 11px;
  color: var(--text);
}
.tag-chip button {
  border: none; background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  padding: 0;
  display: flex; align-items: center;
}
.tag-chip button:hover { color: var(--red); }
.tag-add-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.tag-add-row input { max-width: 180px; flex: none; }

/* ── Dynamic list rows ── */
.list-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 6px 8px;
}
.list-row input { flex: 1; min-width: 0; }
.list-row .lbl-sm {
  font-size: 10px;
  color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
}
.list-row .del-btn {
  width: 22px; height: 22px; flex-shrink: 0;
  border: none; background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 2px;
}
.list-row .del-btn:hover { color: var(--red); background: rgba(244,71,71,0.1); }

/* ── Body preview ── */
#bodyPreview {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 12px 16px;
  margin-top: 6px;
  line-height: 1.6;
  font-size: 13px;
}
#bodyPreview .pm-h2 { font-size: 14px; font-weight: 600; color: var(--blue); margin: 14px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
#bodyPreview .pm-h3 { font-size: 13px; font-weight: 600; color: var(--orange); margin: 10px 0 4px; }
#bodyPreview .pm-p { margin-bottom: 8px; color: var(--text); }
#bodyPreview .pm-ul { padding-left: 20px; margin-bottom: 8px; }
#bodyPreview .pm-ul li { margin-bottom: 3px; }

/* ── Image preview ── */
#imgPreview {
  max-height: 80px;
  max-width: 140px;
  border-radius: 4px;
  border: 1px solid var(--border);
  object-fit: cover;
  display: none;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #6a6a6a; }
</style>
</head>
<body>

<div id="toolbar">
  <span class="tb-title">Projects Editor</span>
  <div class="tb-sep"></div>
  <button class="btn btn-secondary" onclick="importJSON()">Import JSON</button>
  <button class="btn btn-secondary" onclick="copyJSON()">Copy JSON</button>
  <button class="btn btn-primary" onclick="exportJSON()">Export JSON</button>
  <div class="tb-spacer"></div>
  <span id="saveStatus"></span>
  <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleFile(event)">
</div>

<div id="layout">
  <div id="sidebar">
    <div id="sidebarHeader">
      <span>Projects</span>
      <button onclick="addProject()" title="Add new project">+</button>
    </div>
    <div id="projectList"></div>
  </div>

  <div id="editorPanel">
    <div id="noSelection">
      <div>Select a project to edit</div>
      <div class="hint">or click + to create a new one</div>
    </div>

    <div id="editForm" style="display:none">
      <div id="formHeader">
        <div id="formTitle"></div>
        <div class="form-header-actions">
          <button class="btn-icon" onclick="moveProject(-1)" title="Move up">↑</button>
          <button class="btn-icon" onclick="moveProject(1)" title="Move down">↓</button>
          <button class="btn-icon danger" onclick="deleteProject()" title="Delete">✕</button>
        </div>
      </div>

      <div class="form-scroll">

        <div class="form-section">
          <div class="section-title">Identity</div>
          <div class="form-row">
            <label>ID (key)</label>
            <input type="text" id="f-id" placeholder="breachers" oninput="updateId(this.value)">
          </div>
          <div class="form-row">
            <label>varName</label>
            <input type="text" id="f-varName" placeholder="breachersVR" oninput="setField('varName', this.value)">
          </div>
          <div class="form-row">
            <label>Name (card)</label>
            <input type="text" id="f-name" placeholder="Breachers VR" oninput="setField('name', this.value)">
          </div>
          <div class="form-row">
            <label>Title (modal)</label>
            <input type="text" id="f-title" placeholder="Breachers VR" oninput="setField('title', this.value)">
          </div>
        </div>

        <div class="form-section">
          <div class="section-title">Visual</div>
          <div class="form-row">
            <label>Image path</label>
            <input type="text" id="f-image" placeholder="images/..." oninput="setField('image', this.value); updateImgPreview(this.value)">
            <img id="imgPreview" alt="preview">
          </div>
          <div class="form-row-2">
            <div class="form-col">
              <label>Lang label</label>
              <input type="text" id="f-lang-label" placeholder="C#" oninput="setNested('lang','label',this.value)">
            </div>
            <div class="form-col">
              <label>Lang CSS class</label>
              <input type="text" id="f-lang-cls" placeholder="lb-cs" oninput="setNested('lang','cls',this.value)">
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="section-title">Meta</div>
          <div class="form-row">
            <label>Icon class</label>
            <input type="text" id="f-meta-icon" placeholder="fa-solid fa-briefcase" oninput="setNested('meta','icon',this.value)">
          </div>
          <div class="form-row">
            <label>Meta text</label>
            <input type="text" id="f-meta-text" placeholder="Company · Year" oninput="setNested('meta','text',this.value)">
          </div>
        </div>

        <div class="form-section">
          <div class="section-title">Description</div>
          <textarea id="f-desc" rows="3" oninput="setField('desc', this.value)" placeholder="Short description shown on the card…"></textarea>
        </div>

        <div class="form-section">
          <div class="section-title">Tags</div>
          <div id="tagsContainer" class="tags-list"></div>
          <div class="tag-add-row">
            <input type="text" id="tagInput" placeholder="Add tag…" onkeydown="if(event.key==='Enter'){addTag();event.preventDefault()}">
            <button class="btn-ghost" onclick="addTag()">Add</button>
          </div>
        </div>

        <div class="form-section">
          <div class="section-title">Card Links</div>
          <div id="cardLinksContainer"></div>
          <button class="btn-add" onclick="addCardLink()">+ Add link</button>
        </div>

        <div class="form-section">
          <div class="section-title">Videos</div>
          <div id="videosContainer"></div>
          <button class="btn-add" onclick="addVideo()">+ Add video</button>
        </div>

        <div class="form-section">
          <div class="section-title">Modal Links</div>
          <div id="linksContainer"></div>
          <button class="btn-add" onclick="addLink()">+ Add link</button>
        </div>

        <div class="form-section">
          <div class="section-title">
            <span>Body HTML</span>
            <button class="btn-ghost" id="previewToggleBtn" onclick="togglePreview()">Show Preview</button>
          </div>
          <textarea id="f-body" rows="18" class="mono" oninput="setField('body', this.value)" placeholder="<p class=&quot;pm-p&quot;>…"></textarea>
          <div id="bodyPreview" style="display:none"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────
let order = [];      // array of ids, defines render order
let projects = {};   // { id: {...projectData} }
let selectedId = null;
let pendingIdChange = null; // track rename

// ── Bootstrap ────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  // Try to load from localStorage first
  const lsData = localStorage.getItem('projects-editor-data');
  if (lsData) {
    try {
      loadData(JSON.parse(lsData));
      setStatus('Loaded from auto-save');
      return;
    } catch(e) {}
  }
  // Try to fetch data/projects.json
  try {
    const res = await fetch('data/projects.json');
    if (res.ok) {
      loadData(await res.json());
      setStatus('Loaded from projects.json');
      return;
    }
  } catch(e) {}
  // Empty state
  renderSidebar();
});

function loadData(data) {
  projects = {};
  order = [];
  for (const [id, p] of Object.entries(data)) {
    projects[id] = { ...p };
    order.push(id);
  }
  renderSidebar();
}

// ── Sidebar ──────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('projectList');
  if (order.length === 0) {
    list.innerHTML = '<div style="padding:16px 12px;color:var(--text-dim);font-size:12px">No projects yet</div>';
    return;
  }
  list.innerHTML = order.map((id, i) => {
    const p = projects[id];
    const name = p.name || id;
    const sel = id === selectedId ? ' selected' : '';
    return `<div class="proj-item${sel}" onclick="selectProject('${id}')">
      <div style="flex:1;overflow:hidden">
        <div class="proj-item-name">${escHtml(name)}</div>
        <div class="proj-item-id">${escHtml(id)}</div>
      </div>
      <div class="proj-item-actions">
        <button class="proj-item-btn" onclick="event.stopPropagation();moveProjectById('${id}',-1)" title="Move up">↑</button>
        <button class="proj-item-btn" onclick="event.stopPropagation();moveProjectById('${id}',1)" title="Move down">↓</button>
        <button class="proj-item-btn del" onclick="event.stopPropagation();deleteProjectById('${id}')" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('');
}

// ── Select & populate form ───────────────────────────────────────────
function selectProject(id) {
  selectedId = id;
  renderSidebar();
  const p = projects[id];
  document.getElementById('noSelection').style.display = 'none';
  document.getElementById('editForm').style.display = 'flex';
  document.getElementById('formTitle').textContent = p.name || id;

  document.getElementById('f-id').value = id;
  document.getElementById('f-varName').value = p.varName || '';
  document.getElementById('f-name').value = p.name || '';
  document.getElementById('f-title').value = p.title || '';
  document.getElementById('f-image').value = p.image || '';
  document.getElementById('f-lang-label').value = (p.lang && p.lang.label) || '';
  document.getElementById('f-lang-cls').value = (p.lang && p.lang.cls) || '';
  document.getElementById('f-meta-icon').value = (p.meta && p.meta.icon) || '';
  document.getElementById('f-meta-text').value = (p.meta && p.meta.text) || '';
  document.getElementById('f-desc').value = p.desc || '';
  document.getElementById('f-body').value = p.body || '';

  updateImgPreview(p.image || '');
  renderTags();
  renderCardLinks();
  renderVideos();
  renderLinks();

  // Reset body preview
  document.getElementById('bodyPreview').style.display = 'none';
  document.getElementById('bodyPreview').innerHTML = '';
  document.getElementById('previewToggleBtn').textContent = 'Show Preview';
}

function updateImgPreview(path) {
  const img = document.getElementById('imgPreview');
  if (path) {
    img.src = path;
    img.style.display = 'block';
    img.onerror = () => { img.style.display = 'none'; };
  } else {
    img.style.display = 'none';
  }
}

// ── Field setters ─────────────────────────────────────────────────────
function setField(field, value) {
  if (!selectedId) return;
  projects[selectedId][field] = value;
  if (field === 'name') {
    document.getElementById('formTitle').textContent = value || selectedId;
    renderSidebar();
  }
  autoSave();
}

function setNested(parent, field, value) {
  if (!selectedId) return;
  if (!projects[selectedId][parent]) projects[selectedId][parent] = {};
  projects[selectedId][parent][field] = value;
  autoSave();
}

function updateId(newId) {
  if (!selectedId || !newId || newId === selectedId) return;
  if (projects[newId]) { return; } // id already taken
  const p = projects[selectedId];
  delete projects[selectedId];
  projects[newId] = p;
  const idx = order.indexOf(selectedId);
  if (idx !== -1) order[idx] = newId;
  selectedId = newId;
  renderSidebar();
  autoSave();
}

// ── Tags ──────────────────────────────────────────────────────────────
function renderTags() {
  const p = projects[selectedId];
  const tags = p.tags || [];
  document.getElementById('tagsContainer').innerHTML = tags.map((t, i) =>
    `<span class="tag-chip">${escHtml(t)}<button onclick="removeTag(${i})" title="Remove">×</button></span>`
  ).join('');
}

function addTag() {
  const inp = document.getElementById('tagInput');
  const val = inp.value.trim();
  if (!val || !selectedId) return;
  const p = projects[selectedId];
  if (!p.tags) p.tags = [];
  p.tags.push(val);
  inp.value = '';
  renderTags();
  autoSave();
}

function removeTag(i) {
  if (!selectedId) return;
  projects[selectedId].tags.splice(i, 1);
  renderTags();
  autoSave();
}

// ── Card Links ────────────────────────────────────────────────────────
function renderCardLinks() {
  const p = projects[selectedId];
  const links = p.cardLinks || [];
  document.getElementById('cardLinksContainer').innerHTML = links.map((l, i) =>
    `<div class="list-row">
      <span class="lbl-sm">ico</span>
      <input type="text" value="${escAttr(l.ico||'')}" oninput="updateArr('cardLinks',${i},'ico',this.value)" placeholder="fa-brands fa-youtube" style="flex:1.5">
      <span class="lbl-sm">label</span>
      <input type="text" value="${escAttr(l.label||'')}" oninput="updateArr('cardLinks',${i},'label',this.value)" placeholder="Trailer" style="flex:0.7">
      <span class="lbl-sm">url</span>
      <input type="text" value="${escAttr(l.url||'')}" oninput="updateArr('cardLinks',${i},'url',this.value)" placeholder="https://…" style="flex:2">
      <button class="del-btn" onclick="removeArr('cardLinks',${i})">×</button>
    </div>`
  ).join('');
}

function addCardLink() {
  if (!selectedId) return;
  const p = projects[selectedId];
  if (!p.cardLinks) p.cardLinks = [];
  p.cardLinks.push({ ico: '', label: '', url: '' });
  renderCardLinks();
  autoSave();
}

function addVideo() {

function addLink() {

// ── Generic array helpers ─────────────────────────────────────────────
function updateArr(field, idx, key, value) {
  if (!selectedId) return;
  projects[selectedId][field][idx][key] = value;
  autoSave();
}

function removeArr(field, idx) {
  if (!selectedId) return;
  projects[selectedId][field].splice(idx, 1);
  if (field === 'cardLinks') renderCardLinks();
  else if (field === 'videos') renderVideos();
  else if (field === 'links') renderLinks();
  autoSave();
}

// ── Project management ────────────────────────────────────────────────
function addProject() {
  let id = 'new-project';
  let n = 1;
  while (projects[id]) id = `new-project-${n++}`;
  projects[id] = {
    varName: 'newProject',
    lang: { label: 'C#', cls: 'lb-cs' },
    image: '',
    name: 'New Project',
    meta: { icon: 'fa-solid fa-code', text: '' },
    desc: '',
    tags: [],
    cardLinks: [],
    title: 'New Project',
    videos: [],
    body: '',
    links: []
  };
  order.push(id);
  renderSidebar();
  selectProject(id);
  document.getElementById('f-id').focus();
  autoSave();
}

function deleteProject() {
  if (!selectedId) return;
  deleteProjectById(selectedId);
}

function deleteProjectById(id) {
  if (!confirm(`Delete "${projects[id]?.name || id}"?`)) return;
  delete projects[id];
  const idx = order.indexOf(id);
  if (idx !== -1) order.splice(idx, 1);
  if (selectedId === id) {
    selectedId = null;
    document.getElementById('noSelection').style.display = '';
    document.getElementById('editForm').style.display = 'none';
  }
  renderSidebar();
  autoSave();
}

function moveProject(dir) {
  if (!selectedId) return;
  moveProjectById(selectedId, dir);
}

function moveProjectById(id, dir) {
  const idx = order.indexOf(id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= order.length) return;
  [order[idx], order[newIdx]] = [order[newIdx], order[idx]];
  renderSidebar();
  autoSave();
}

// ── Body preview ──────────────────────────────────────────────────────
function togglePreview() {
  const preview = document.getElementById('bodyPreview');
  const textarea = document.getElementById('f-body');
  const btn = document.getElementById('previewToggleBtn');
  if (preview.style.display === 'none') {
    preview.innerHTML = textarea.value;
    preview.style.display = 'block';
    btn.textContent = 'Hide Preview';
  } else {
    preview.style.display = 'none';
    preview.innerHTML = '';
    btn.textContent = 'Show Preview';
  }
}

// ── Import / Export ───────────────────────────────────────────────────
function importJSON() {
  document.getElementById('fileInput').click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      if (confirm('Replace all current projects with imported data?')) {
        selectedId = null;
        document.getElementById('noSelection').style.display = '';
        document.getElementById('editForm').style.display = 'none';
        loadData(data);
        autoSave();
        setStatus('Imported');
      }
    } catch(err) {
      alert('Invalid JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function toJSON() {
  const result = {};
  for (const id of order) {
    result[id] = { ...projects[id] };
  }
  return result;
}

function exportJSON() {
  const json = JSON.stringify(toJSON(), null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'projects.json';
  a.click();
  URL.revokeObjectURL(url);
  setStatus('Exported projects.json');
}

function copyJSON() {
  const json = JSON.stringify(toJSON(), null, 2);
  navigator.clipboard.writeText(json).then(() => setStatus('Copied to clipboard'));
}

// ── Auto-save ─────────────────────────────────────────────────────────
let saveTimer = null;
function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem('projects-editor-data', JSON.stringify(toJSON()));
      setStatus('Auto-saved', 2000);
    } catch(e) {}
  }, 800);
}

function setStatus(msg, clearAfter) {
  const el = document.getElementById('saveStatus');
  el.textContent = msg;
  el.classList.add('saved');
  if (clearAfter) {
    setTimeout(() => { el.textContent = ''; el.classList.remove('saved'); }, clearAfter);
  }
}

// ── Helpers ───────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}
</script>
